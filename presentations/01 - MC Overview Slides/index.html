	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};


        </script>

# MagmaCore

- Magma Core is an attempt to implement a High Quality Data Modelling (HQDM) framework based on the model presented in Dr Matthew West's book "Developing High Quality Data Models"

- You would be well advised to read Dr. West's book because I might not be explaining all the details here.

- It has been used to develop a number of prototype systems, one of which is still in use, and was first published by GCHQ in the UK

- My fork is available on GitHub: https://github.com/twalmsley/MagmaCore

- The original is here: https://github.com/gchq/MagmaCore

- The original appears to have fallen out of maintenance, hence my fork. I wrote pretty much all of the code, so I will try to maintain it and develop it further in my fork.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

#  Background Details

- MagmaCore is written in Java.

- It was published by GCHQ from an internal project, and is intended to foster development of HQDM-based systems in the hope of improving data modelling and data model compatibility to make data sharing more straightforward.

- It is based on RDF and the Apache Jena library for storing data as an RDF graph.

- Apache Jena supports inferencing rule which can be used to enhance the underlying model with additional facts not directly present in the original dataset.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

# MagmaCore

- Uses Java 17 and is built using Maven, which results in the following built libraries:

	- **core** - Database and Database Access Services

	- **hqdm** - The HQDM Top Level Ontology implementation

	- **hqdm-canonical** - Classes for using HQDM in a particular canonical way

	- **model-extension-example** - An example of how to add domain-specific extensions

	- **examples** - Various examples of how to use the library.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

# MagmaCore

## Core Package

- Use for connecting to a local or remote Jena database, or a SPARQL endpoint.

- Uses a `MagmaCoreServiceFactory` to create a `MagmaCoreService` instance for interacting with the selected database.

- Contains utilities for batch CRUD operations and for creating random UUIDs.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# MagmaCore
## HQDM Package
- Contains Service classes for creating HQDM model instances and relationships.

- You can use the services or create the model manually.

- Contains an extension mechanism for automatically discovering extension modules that contain domain-specific extensions to the core Top Level Ontology.

- The `HqdmObjectFactory`helps when creating HQDM entities from RDF Triples.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# MagmaCore

## Hqdm-Canonical Package
- Contains a set of `*Builder` classes to make creation of the HQDM data model more straightforward.

- The `*Builder` classes are designed to indicate what relationships to other objects are needed, and which are considered mandatory by the original HQDM data model.

- The `*Builder` methods can be chained together before the final call to the `build()` method validates the object and returns the new instance or throws an exception to indicate the error.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 700px; width: 960px; min-height: 700px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# MagmaCore
## Model-Extension-Example
- Implements an example of an SPI (Service Provider Interface) extension module for HQDM.

- The example adds a few simple domain classes that extend existing HQDM package classes, and which can be used as if they were provided by the MagmaCore library.

- This example doesn't use `*Builder` classes, but these could be provided by the extension if preferred.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

# MagmaCore
## Examples Package
- There are several packages within this package:

	- **data** - Creates some objects that are used by multiple examples
	- **extensions** - Shows how to use the example extension module described above
	- **functional** - Some examples that use a functional-programming style.
	- **service** - Examples of how to use the core `MagmaCoreService` class.
	- **signs** - Examples for how to create signs.
</div></script></section><section  data-markdown><script type="text/template"><!-- .slide: class="drop" -->

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
	var isLight = isLight(bgColor);

	if(isLight){
		document.body.classList.add('has-light-background');
	} else {
		document.body.classList.add('has-dark-background');
	}
